title: 'People Like You: Youth Empowerment Symposium'
category: workshop
summary: A one-day symposium in Tema bringing 700–1,000 young people together with mentors for practical career and life guidance.
description:
  - People Like You is a one-day, in-person youth empowerment and capacity-building
    symposium for young people across junior and secondary school, tertiary
    education, and those looking for work.
  - The day pairs attendees with locally and internationally renowned young
    mentors for guidance on career, social, and personal decisions.
  - It is held in the Tema enclave and marks the Movement's run-up to ten years
    of community engagement in April 2028.
