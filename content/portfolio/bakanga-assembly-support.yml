title: Bakanga Assembly — church support
category: church
year: '2026'
location: Bawku, Upper East
summary: Working through a practical needs list with a missionary church in Bawku.
description:
  - 'When we visited Bakanga Assembly, we expected to talk about music. The
    leadership gave us a different list: chairs, a reliable keyboard, transport
    for visiting preachers, and a roof repair.'
  - Supporting missionary churches with instruments and seating is one of the
    objectives in CLM’s constitution, and this is what it looks like in
    practice.
  - Sourcing is ongoing. We will publish what was supplied and what is still
    outstanding rather than announcing it as finished.
