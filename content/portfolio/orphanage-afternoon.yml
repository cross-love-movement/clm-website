title: An afternoon at a partner orphanage
category: outreach
year: '2026'
location: Greater Accra
summary: Practical donations and time with children at a partner home.
description:
  - 'We asked the home what it actually needed before turning up. The list was
    specific: provisions, bedding, and help with transport for a medical
    appointment.'
  - Volunteers spent the afternoon with the children rather than photographing
    them, and the visit ended with a plan for the next one.
  - We do not publish the name or location of the home without permission, and
    we do not use children’s faces in our communications.
