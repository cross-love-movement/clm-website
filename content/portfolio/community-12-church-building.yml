title: Satellite church, Community 12
category: church
year: Community 12
location: Tema, Ghana
summary: Five bags of cement towards a 100-capacity satellite church in a slum in the light industrial area of Tema.
description:
  - The Church of Pentecost, Paradise Assembly, Community 12, set out to raise a
    satellite church in a slum in the light industrial area of Tema.
  - We contributed five bags of cement to the build. The 100-capacity church has
    since been dedicated and now hosts training for young people in sobriety and
    start-up grants.
  - When fire swept the community in 2024, and flooding displaced members in 2026,
    we provided relief items and recovery support.
