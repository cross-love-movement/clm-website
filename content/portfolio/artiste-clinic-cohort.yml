title: Artiste Clinic — first cohort
category: recordings
year: '2026'
location: Accra
summary: Small-group sessions on songwriting, stage craft, and sustaining a
  music career.
description:
  - The clinic is a room, not a lecture. Each participant brought one song they
    were proud of and one they were stuck on, and the group worked through both.
  - Sessions covered vocal technique, arrangement, performance, and the
    unglamorous business of pricing work and asking to be paid.
  - The cohort was small on purpose. We would rather run three honest rooms than
    one crowded event.
