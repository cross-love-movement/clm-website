title: Cross Sessions — Tema
category: performances
year: '2026'
location: Tema, Greater Accra
summary: A full evening of worship, testimony, and performance at Paradise Assembly.
description:
  - Cross Sessions brought CLM musicians, guest gospel artistes, and the host
    congregation into one programme built around the Word rather than a headline
    act.
  - Worship sets were interspersed with short testimonies from the community,
    and the host church closed the evening in prayer. The room was full, and the
    queue at the door started before the advertised opening time.
  - The session was planned with the church leadership over several weeks,
    including the running order, sound, and how visiting artistes would be
    introduced.
