summary: Seating for a community church in a region that has lived with conflict for more than two decades.
description:
  - In Bawku, a community has confronted tribal conflict for over twenty years.
    The local church has remained a place of comfort and hope.
  - During the 4th edition of Cross Sessions, we raised funds and bought twenty
    chairs for the Bakanga Pentecost Church.
  - Since the donation, membership and participation have grown.
