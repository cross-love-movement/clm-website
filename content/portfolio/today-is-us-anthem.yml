title: Today Is Us peace anthem
category: recordings
year: '2024'
location: Ghana
summary: A peace anthem written with musicians from five cultural backgrounds, a youth Muslim community leader, and a children’s orchestra in Tema.
description:
  - For the 2024 general elections, we produced a peace anthem as the centrepiece
    of the Today Is Us campaign.
  - The recording brought together youthful musicians from five cultural
    backgrounds, a youth Muslim community leader writing in local dialects, and
    the Académie de Musique Classique (ADMC-Tema) children’s orchestra.
  - The campaign included engagements with the Ghana Peace Council and the Ghana
    National Mosque Complex, and reached a national audience through the Onua
    Reality Show.
