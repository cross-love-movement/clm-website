location: Tema, Ghana
summary: A one-day symposium for 700–1,000 young people, ahead of the Movement's tenth year.
description:
  - Scheduled for 12 June 2027, People Like You is a one-day, in-person youth
    empowerment and capacity-building symposium.
  - It brings together young people from junior and secondary school, tertiary
    education, and job-seeking for mentorship and strategic guidance from young
    mentors.
  - The programme is designed to build confidence and practical direction as the
    Movement approaches ten years of community engagement in April 2028.
