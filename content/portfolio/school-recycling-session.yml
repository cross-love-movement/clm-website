slug: school-recycling-session
title: School recycling session
category: creation
year: '2026'
location: Tema
summary: A practical session with pupils on sorting, plastic recovery, and why
  the drains matter.
description:
  - A creation care volunteer ran a session with primary pupils using the
    school’s own waste as the teaching material — no slides, no abstractions.
  - Pupils sorted a day’s worth of waste into streams, then talked about where
    it goes after the bin. The most common question was about the drains.
  - The school asked us to return with a second session for staff, which is
    usually the sign that something landed.
