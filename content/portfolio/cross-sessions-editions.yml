slug: cross-sessions-editions
title: Cross Sessions
category: performances
year: 2018–2026
location: Tema & Accra, Ghana
summary: Our annual flagship creative event, hosted on Easter Sunday, bringing a cross-denominational network of young creatives onto one stage.
description:
  - Cross Sessions is a community-based, non-denominational creative event hosted on
    Easter Sundays. Young creatives from Anglican, Presbyterian, Methodist, The
    Church of Pentecost, Roman Catholic, SDA, Evangelical Presbyterian, Deeper
    Life, and other traditions share one programme.
  - Each edition features young music and art talent, empowerment expositions,
    and a Power-Point segment, and doubles as a fundraiser for the Movement’s
    projects.
  - We have hosted nine editions since 2018.
