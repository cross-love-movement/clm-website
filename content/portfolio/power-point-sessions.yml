category: empowerment
year: 2025–2026
location: Tema, Ghana
summary: The one-lesson segment inside Cross Sessions, platforming young leaders who are already building something.
description:
  - After the creative showcases, Cross Sessions closes with one question — what
    is the one-point lesson the audience takes home?
  - In 2025, the BusStop Boyz spoke about building a sanitation movement through
    volunteerism. In 2026, Edward Asare of First Baptist Church, Tema, spoke on
    “Christ, Creatives, Church, and Country”.
  - Both sessions encouraged young people from different denominations to carry
    the work into their own communities.
